openapi: 3.1.0
info:
  title: Pedidos API v1
  version: 1.1.0
  description: |
    Contrato atual do canal web, preservado por pelo menos 6 meses após o GA do v2 (ADR-004).
    Única mudança em relação ao contrato original: `Idempotency-Key` opcional (aditiva).
    Sem a chave, o comportamento é o antigo: cada chamada cria um pedido.

    Autenticação: o v1 segue como hoje, sem token exigido pela API. O consumidor atual (canal web) chama
    sem `Authorization` e é identificado como cliente `web`. Exigir token aqui quebraria o consumidor atual;
    a autenticação OAuth2/OIDC por cliente de API vale para o v2 (ADR-007), e o v1 é desligado após o Sunset.
  contact:
    name: Time de Pedidos
servers:
  - url: https://api-br.exemplo.com
    description: Célula Brasil
tags:
  - name: pedidos
paths:
  /v1/orders:
    post:
      operationId: criarPedidoV1
      tags: [pedidos]
      summary: Cria um pedido
      description: Comportamento atual do canal web. Com `Idempotency-Key`, repetições não criam outro pedido.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            example:
              customerId: cli-0001
              items:
                - productId: SKU-0001
                  quantity: 2
      responses:
        '201':
          description: Pedido criado (ou resposta original, se for replay com a mesma chave)
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /v1/orders/{id}:
    get:
      operationId: consultarPedidoV1
      tags: [pedidos]
      summary: Consulta um pedido
      description: Devolve id, status e total do pedido, como hoje.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Pedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/Problem'
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Opcional no v1. Se vier, deduplica por cliente por 24 h (ADR-001).
      schema:
        type: string
        minLength: 1
        maxLength: 64
  headers:
    IdempotentReplayed:
      description: '`true` quando a resposta é a original de uma chamada anterior com a mesma chave.'
      schema:
        type: string
        enum: ['true']
  responses:
    Problem:
      description: Erro no formato RFC 9457
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    CreateOrderRequest:
      type: object
      required: [customerId, items]
      properties:
        customerId:
          type: string
          minLength: 1
          maxLength: 64
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [productId, quantity]
            properties:
              productId:
                type: string
                minLength: 1
              quantity:
                type: integer
                minimum: 1
                maximum: 999
    Order:
      type: object
      required: [id, status, total]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [CREATED, CONFIRMED, SHIPPED, DELIVERED, CANCELLED]
        total:
          type: number
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
